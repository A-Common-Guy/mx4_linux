; mx4ctl daemon configuration — copy to ~/.config/mx4ctl/config.ini
; Waveform names: sharp_state_change damp_state_change sharp_collision
;   damp_collision subtle_collision happy_alert angry_alert completed
;   square wave firework mad knock jingle ringing whisper_collision
;
; Actions (gestures, menu entries, button commands) are either a shell
; command or an "@built-in" that adapts to X11/Wayland automatically:
;   @workspace-prev @workspace-next @overview @show-desktop @minimize
;   @screenshot @play-pause

[haptics]
; haptic intensity 0..100 applied at startup (empty = leave as is, 0 = off)
level = 60

[button]
; the thumb-panel "haptic" button (does nothing on stock Linux).
; press / long_press can be: menu | command | none
press = menu
press_waveform = sharp_state_change
long_press = command
long_press_command = xdotool key XF86AudioPlay
long_press_waveform = knock
long_press_ms = 450
; haptic tick when picking a menu entry
menu_select_waveform = damp_state_change
; size of the actions ring (1.0 = default; bump it on a hidpi screen)
menu_scale = 1.0
; how hard you must press the button (see `mx4ctl force` for the valid range;
; empty = leave as configured)
force_threshold =

[menu]
; entries of the actions ring: label = command or @built-in. Each entry gets
; an icon drawn to match the others, picked from the label and the command;
; prefix the value with "icon::" to choose one yourself — a drawn glyph
; ($rocket $brightness $volume $terminal $lock $camera $play $mic $grid
; $monitor $minimize $search $folder $mail $globe $chat $next $prev
; $sliders $copy $pencil) or any icon-theme name.
; Three entries are the ring's own: @brightness and @volume are dials (scroll
; over them to change the level, click opens the settings page) and @mic-mute
; is a toggle whose icon shows what a click would do.
KRunner = $rocket::dbus-send --type=method_call --dest=org.kde.krunner /App org.kde.krunner.App.display || krunner
Screenshot = @screenshot
Terminal = konsole
Mute microphone = @mic-mute
Brightness = @brightness
Volume = @volume
Play / Pause = @play-pause
Lock screen = loginctl lock-session

[gestures]
; hold the gesture button (thumb tip) and flick — the cursor freezes while
; held, and the move direction picks the action. tap = press without moving.
enabled = true
; sensor counts before a move counts as a flick (~2.5 mm at 1000 dpi)
threshold = 100
waveform = damp_state_change
left = @workspace-prev
right = @workspace-next
up = @show-desktop
down = @minimize
tap = @overview

[workspace]
; soft haptic tick whenever the active workspace changes
enabled = true
waveform = whisper_collision

[notifications]
; buzz on desktop notifications; extra keys map app-name substrings to waveforms
enabled = true
; stay silent while GNOME Do Not Disturb is on
respect_dnd = true
default = subtle_collision
slack = knock
teams = knock
thunderbird = jingle
signal = knock

[battery]
low_percent = 10
waveform = mad
