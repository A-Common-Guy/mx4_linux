# Every push to main (merges included) builds the .deb, smoke-tests it on a
# clean Ubuntu runner, and publishes a GitHub release with a changelog of the
# commits since the previous release.
name: release

on:
  push:
    branches: [main]
  # so a release can also be cut by hand from the Actions tab — a fork with
  # Actions freshly enabled has no push to replay
  workflow_dispatch:

permissions:
  contents: write

# one release at a time — a second push waits instead of racing for the tag
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # tags + full history, for version and changelog

      - name: Pick the version
        id: ver
        run: |
          BASE=$(python3 -c "import mx4; print(mx4.__version__)")
          VERSION="$BASE"
          # a push without a version bump still releases: add a package
          # revision (0.4.0-1, 0.4.0-2, ...) so apt sees an upgrade
          if git rev-parse -q --verify "refs/tags/v$BASE" >/dev/null; then
            N=1
            while git rev-parse -q --verify "refs/tags/v$BASE-$N" >/dev/null; do
              N=$((N + 1))
            done
            VERSION="$BASE-$N"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the .deb
        run: MX4_VERSION='${{ steps.ver.outputs.version }}' ./packaging/build-deb.sh

      - name: Smoke-test the package
        run: |
          sudo apt-get update
          sudo apt-get install -y "./dist/mx4ctl_${{ steps.ver.outputs.version }}_all.deb"
          mx4ctl --help
          mx4-wizard --check || true    # no mouse on a runner; just prove it runs

      - name: Write the changelog
        run: |
          LAST=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## Changes"
            git log --no-merges --pretty='- %s (%h)' ${LAST:+$LAST..HEAD}
            if [ -n "$LAST" ]; then
              echo
              echo "**Full diff:** https://github.com/${{ github.repository }}/compare/$LAST...v${{ steps.ver.outputs.version }}"
            fi
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "./dist/mx4ctl_${{ steps.ver.outputs.version }}_all.deb" \
            --target "$GITHUB_SHA" \
            --title "mx4ctl ${{ steps.ver.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
